# electron-builder configuration for the Grand Theft Pundit desktop build.
# Docs: https://www.electron.build/configuration
#
# Everything packaged lives inside desktop/: main.js plus app/ (index.html, js/, vendor/ copied in
# by sync-game.js, which also runs here as the beforePack hook so a bare `npx electron-builder`
# still packages the current game files).

appId: com.grievancecity.grandtheftpundit
productName: Grand Theft Pundit
copyright: Copyright © 2026 Grievance City Games. A parody; no real pundits were harmed.
artifactName: Grand-Theft-Pundit-${version}-${os}-${arch}.${ext}

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - lib/**/*
  - splash/**/*
  - app/**/*

asar: true
compression: normal

# Electron fuses, flipped in the packaged binary right before signing (electron-builder runs
# @electron/fuses). The packaged game cannot be started as a plain Node.js runtime
# (ELECTRON_RUN_AS_NODE), take code through NODE_OPTIONS or --inspect, or load an app from outside
# app.asar; app.asar is checked against the hash embedded at build time (macOS and Windows).
# grantFileProtocolExtraPrivileges stays on: with it off, Electron cannot load app/index.html from
# inside app.asar at all (ERR_FILE_NOT_FOUND, tested), and moving the game to a custom protocol
# would change its storage origin and lose everyone's saves (localStorage is per origin; file:// is
# one origin however the app path changes). Navigation away from the game page is blocked in
# main.js instead. Cookie encryption stays off: the game sets no cookies, and turning it on makes
# macOS and Linux ask the keychain/keyring, which can prompt for a password on every update of an
# unsigned build. resetAdHocDarwinSignature re-signs the .app ad hoc after flipping (an unsigned
# Apple Silicon app with a broken signature is killed at launch); it needs `codesign`, so building
# the mac targets on Linux needs -c.electronFuses.resetAdHocDarwinSignature=false (and then the
# arm64 app only runs after `codesign --force --deep -s - "Grand Theft Pundit.app"`).
# test/check-fuses.js reads them back from a packaged app; CI runs it on every platform.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: true
  enableCookieEncryption: false
  resetAdHocDarwinSignature: true
npmRebuild: false
removePackageScripts: true
beforePack: ./sync-game.js
# electron-builder never uploads anything itself: the workflow attaches the files to the GitHub
# Release. null also stops electron-builder from guessing a publisher when a GH_TOKEN happens to be
# in the environment (which makes it crash on repository detection). The release workflow passes a
# github publish config on the command line (with --publish never) only so electron-builder writes
# the electron-updater metadata (latest.yml, latest-mac.yml, latest-linux.yml, *.blockmap); the app
# itself reads its feed from "gtpUpdates" in package.json (lib/updater.js), so local builds update
# from the same place.
publish: null

# ---------------------------------------------------------------- macOS: Apple Silicon and Intel
mac:
  category: public.app-category.games
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # No `identity` here on purpose. With CSC_LINK (+ CSC_KEY_PASSWORD) in the environment,
  # electron-builder imports that Developer ID certificate and signs; without it the build is
  # unsigned and friends open it through Gatekeeper's "unidentified developer" flow (README).
  # Notarization runs automatically after signing when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
  # APPLE_TEAM_ID are set; it also needs hardenedRuntime=true, which the release workflow passes
  # on the command line for signed builds (-c.mac.hardenedRuntime=true).
  hardenedRuntime: false
  gatekeeperAssess: false
  darkModeSupport: true
  minimumSystemVersion: "11.0"

dmg:
  sign: false
  # updates use the zip (latest-mac.yml); the dmg is only for the first install
  writeUpdateInfo: false
  # 560x400 artwork (+ background@2x.png for Retina), rendered by build/make-dmg-background.js;
  # the icon positions below match the arrow and the light band in build/dmg-background.html
  background: build/background.png
  title: ${productName} ${version}
  iconSize: 100
  window:
    width: 560
    height: 400
  contents:
    - x: 150
      y: 190
    - x: 410
      y: 190
      type: link
      path: /Applications

# ---------------------------------------------------------------- Windows
win:
  icon: build/icon-full.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Grand Theft Pundit
  # the installer's .blockmap lets electron-updater download only the changed blocks
  differentialPackage: true
  artifactName: Grand-Theft-Pundit-${version}-${os}-${arch}-setup.${ext}

portable:
  artifactName: Grand-Theft-Pundit-${version}-${os}-${arch}-portable.${ext}

# ---------------------------------------------------------------- Linux
linux:
  icon: build/icon-full.png
  category: Game
  synopsis: Open-city parody game about the pundit-industrial complex
  maintainer: Grievance City Games
  executableName: grand-theft-pundit
  # desktopName in package.json + syncDesktopName lets desktop environments match the running
  # window (WM_CLASS) to the .desktop entry inside the AppImage
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
