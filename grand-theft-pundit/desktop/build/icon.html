<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grand Theft Pundit icon</title>
<meta name="description" content="Source page for the desktop app icon: gold arcade letters GTP with a folding-table T on near-black, inside a macOS-style rounded mask. Rendered to build/icon.png by make-icon.js.">
<style>
/* Two 1024x1024 tiles on a transparent page. make-icon.js screenshots each with omitBackground.
   #mac  : macOS style, the rounded tile sits on the 824px grid with a transparent margin.
   #full : the same tile filling the canvas, for Windows .ico and Linux (where margins look small). */
:root {
  --ink: #06070d;
  --ink-2: #10131f;
  --gold-hi: #ffe79a;
  --gold: #e8b53a;
  --gold-lo: #8a5a10;
  --gold-edge: #3a2404;
  --cyan: #2ee6ff;
  --pink: #ff3fa4;
}
html, body { margin: 0; background: transparent; }
body { display: flex; flex-direction: column; gap: 32px; padding: 0; }
.icon { position: relative; width: 1024px; height: 1024px; overflow: hidden; }
.tile {
  position: absolute;
  background: radial-gradient(ellipse at 50% 18%, #1a1f3d 0%, var(--ink-2) 45%, var(--ink) 100%);
  overflow: hidden;
}
#mac .tile { left: 100px; top: 100px; width: 824px; height: 824px; border-radius: 185px; }
#full .tile { left: 0; top: 0; width: 1024px; height: 1024px; border-radius: 230px; }
.tile svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="icon" id="mac"><div class="tile"><svg viewBox="0 0 824 824" xmlns="http://www.w3.org/2000/svg"><use href="#art"/></svg></div></div>
<div class="icon" id="full"><div class="tile"><svg viewBox="0 0 824 824" xmlns="http://www.w3.org/2000/svg"><use href="#art"/></svg></div></div>

<svg width="0" height="0" style="position:absolute" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff2bf"/>
    <stop offset="0.42" stop-color="#f3c94e"/>
    <stop offset="0.5" stop-color="#d79a1e"/>
    <stop offset="0.58" stop-color="#f6cf5c"/>
    <stop offset="1" stop-color="#9a6612"/>
  </linearGradient>
  <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5b3a08"/>
    <stop offset="1" stop-color="#2a1803"/>
  </linearGradient>
  <linearGradient id="tableTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff2bf"/>
    <stop offset="0.55" stop-color="#e8b53a"/>
    <stop offset="1" stop-color="#b57d16"/>
  </linearGradient>
  <linearGradient id="tableEdge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a86f12"/>
    <stop offset="1" stop-color="#5a3a08"/>
  </linearGradient>
  <linearGradient id="leg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffe79a"/>
    <stop offset="0.5" stop-color="#d79a1e"/>
    <stop offset="1" stop-color="#7a4f0e"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.55" r="0.55">
    <stop offset="0" stop-color="#2ee6ff" stop-opacity="0.28"/>
    <stop offset="0.6" stop-color="#2ee6ff" stop-opacity="0.06"/>
    <stop offset="1" stop-color="#2ee6ff" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000" flood-opacity="0.65"/>
  </filter>
  <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>

  <!-- the artwork, in an 824x824 box -->
  <g id="art">
    <!-- neon-noir backdrop: a cyan floor glow and a faint horizon line -->
    <rect x="0" y="0" width="824" height="824" fill="url(#glow)"/>
    <rect x="80" y="612" width="664" height="6" fill="#2ee6ff" opacity="0.55"/>
    <rect x="80" y="612" width="664" height="6" fill="#2ee6ff" opacity="0.9" filter="url(#pinkGlow)"/>
    <!-- a pink "ON AIR" tally dot up top -->
    <circle cx="412" cy="118" r="18" fill="#ff3fa4" filter="url(#pinkGlow)"/>
    <circle cx="412" cy="118" r="11" fill="#ff8fcf"/>

    <!-- G and P: heavy arcade letters, outlined and bevelled. The T between them is the table. -->
    <g font-family="Inter, 'Inter Display', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="330" text-anchor="middle" filter="url(#shadow)">
      <text x="176" y="520" fill="url(#goldEdge)" stroke="#3a2404" stroke-width="42" stroke-linejoin="round" paint-order="stroke">G</text>
      <text x="176" y="520" fill="url(#gold)" stroke="#fff2bf" stroke-width="6" stroke-linejoin="round" paint-order="stroke">G</text>
      <text x="652" y="520" fill="url(#goldEdge)" stroke="#3a2404" stroke-width="42" stroke-linejoin="round" paint-order="stroke">P</text>
      <text x="652" y="520" fill="url(#gold)" stroke="#fff2bf" stroke-width="6" stroke-linejoin="round" paint-order="stroke">P</text>
    </g>

    <!-- the folding-table T: a slab table top as the crossbar, X-braced folding legs as the stem -->
    <g filter="url(#shadow)" stroke-linejoin="round" stroke-linecap="round">
      <!-- legs (behind the top): two pairs of angled tubes crossing in an X, with a hinge pin -->
      <g stroke="#3a2404" stroke-width="40">
        <line x1="352" y1="336" x2="470" y2="596"/>
        <line x1="472" y1="336" x2="354" y2="596"/>
      </g>
      <g stroke="url(#leg)" stroke-width="22">
        <line x1="352" y1="336" x2="470" y2="596"/>
        <line x1="472" y1="336" x2="354" y2="596"/>
      </g>
      <!-- cross brace and feet -->
      <line x1="348" y1="596" x2="476" y2="596" stroke="#3a2404" stroke-width="30"/>
      <line x1="348" y1="596" x2="476" y2="596" stroke="url(#leg)" stroke-width="12"/>
      <circle cx="412" cy="466" r="22" fill="#2a1803" stroke="#3a2404" stroke-width="10"/>
      <circle cx="412" cy="466" r="11" fill="#ffe79a"/>
      <!-- table top: the crossbar of the T, drawn as a slab with a lit top face and a dark edge -->
      <rect x="296" y="306" width="232" height="34" rx="6" fill="url(#tableEdge)" stroke="#3a2404" stroke-width="30"/>
      <rect x="296" y="306" width="232" height="34" rx="6" fill="url(#tableEdge)"/>
      <path d="M308 262 L516 262 L528 306 L296 306 Z" fill="url(#tableTop)" stroke="#3a2404" stroke-width="30" stroke-linejoin="round"/>
      <path d="M308 262 L516 262 L528 306 L296 306 Z" fill="url(#tableTop)"/>
      <path d="M316 270 L508 270 L514 288 L310 288 Z" fill="#fff2bf" opacity="0.55"/>
    </g>
  </g>
</defs>
</svg>
</body>
</html>
