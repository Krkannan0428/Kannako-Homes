<title>Grand Theft Pundit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A top-down open-city parody crime game about the pundit-industrial complex, drawn entirely in canvas.">
<style>
/* Layout: one full-height stage; the canvas letterboxes a 1280x720 logical view inside it.
   Single deliberate theme: a neon-noir cable-news city at night. */
:root {
  color-scheme: dark;
  --bg: #06070d;
  --bg-glow: #121735;
  --ink: #eef1fb;
  --muted: #8f97b3;
  --neon-pink: #ff3fa4;
  --neon-cyan: #2ee6ff;
  --neon-amber: #ffbe3c;
  --news-red: #ff3b30;
  --panel: rgba(13, 16, 32, 0.86);
  --font-ui: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --font-display: "Arial Black", Impact, "Helvetica Neue", Arial, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --gutter-t: env(safe-area-inset-top, 0px);
  --gutter-b: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}
#app {
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
  background: radial-gradient(ellipse at 50% 120%, var(--bg-glow), var(--bg) 70%);
}
#stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  min-width: 0;
}
#game {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  background: var(--bg);
  outline: none;
  cursor: crosshair;
}
#game:focus-visible { box-shadow: inset 0 0 0 2px var(--neon-cyan); }
#overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  font-family: var(--font-ui);
  color: var(--ink);
}
#overlay > * { pointer-events: auto; }
.gtp-panel {
  background: var(--panel);
  border: 1px solid rgba(46, 230, 255, 0.25);
  border-radius: 6px;
  padding: 8px 12px;
}
@media (prefers-reduced-motion: reduce) {
  #app { background: var(--bg); }
}
</style>
<div id="app">
  <div id="stage">
    <canvas id="game" aria-label="Grand Theft Pundit game view" role="img"></canvas>
    <div id="overlay"></div>
  </div>
</div>
<script>
/* js/00_util.js */
/* Grand Theft Pundit: 00_util.js
 * GTP.util, GTP.rng (seeded, deterministic), GTP.makeRng, GTP.Vec, GTP.SpatialHash.
 * Classic script. Everything attaches to window.GTP.
 */
(function () {
  'use strict';
  var GTP = window.GTP = window.GTP || {};
  GTP.errors = GTP.errors || [];
  GTP.VERSION = '0.1.0';

  // ---------------------------------------------------------------- rng ----
  // mulberry32: tiny, fast, good enough for an arcade game, fully seedable.
  function makeRng(seed) {
    var s = (seed >>> 0) || 1;
    var r = {
      seed: function (n) { s = (n >>> 0) || 1; return r; },
      state: function () { return s; },
      setState: function (n) { s = n >>> 0; },
      random: function () {
        s = (s + 0x6D2B79F5) | 0;
        var t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      },
      range: function (a, b) { return a + (b - a) * r.random(); },
      int: function (a, b) { return a + Math.floor(r.random() * (b - a + 1)); },
      pick: function (arr) { return arr.length ? arr[Math.floor(r.random() * arr.length)] : undefined; },
      chance: function (p) { return r.random() < p; },
      sign: function () { return r.random() < 0.5 ? -1 : 1; },
      shuffle: function (arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(r.random() * (i + 1));
          var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
      },
      fork: function (salt) { return makeRng((s ^ Math.imul(salt | 0, 0x9E3779B1)) >>> 0); }
    };
    return r;
  }
  GTP.makeRng = makeRng;
  GTP.rng = makeRng(1);

  // --------------------------------------------------------------- util ----
  var TAU = Math.PI * 2;
  var util = GTP.util = {
    TAU: TAU,
    clamp: function (v, a, b) { return v < a ? a : (v > b ? b : v); },
    lerp: function (a, b, t) { return a + (b - a) * t; },
    smoothstep: function (t) { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); },
    dist: function (x1, y1, x2, y2) { var dx = x2 - x1, dy = y2 - y1; return Math.sqrt(dx * dx + dy * dy); },
    dist2: function (x1, y1, x2, y2) { var dx = x2 - x1, dy = y2 - y1; return dx * dx + dy * dy; },
    angleTo: function (x1, y1, x2, y2) { return Math.atan2(y2 - y1, x2 - x1); },
    wrapAngle: function (a) {
      a = a % TAU;
      if (a > Math.PI) a -= TAU; else if (a < -Math.PI) a += TAU;
      return a;
    },
    angleLerp: function (a, b, t) { return a + util.wrapAngle(b - a) * t; },
    angleDiff: function (a, b) { return util.wrapAngle(b - a); },
    sign: function (v) { return v > 0 ? 1 : (v < 0 ? -1 : 0); },
    // FNV-1a style string hash -> 32-bit unsigned int
    hash: function (str) {
      str = String(str);
      var h = 0x811c9dc5;
      for (var i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 0x01000193);
      }
      return h >>> 0;
    },
    // integer lattice hash for procedural texture decisions, returns [0,1)
    hash2: function (x, y, salt) {
      var h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul((salt | 0) + 0x9e3779b9, 0x85ebca6b);
      h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; h = Math.imul(h, 0x297a2d39); h ^= h >>> 15;
      return (h >>> 0) / 4294967296;
    },
    circleHit: function (ax, ay, ar, bx, by, br) {
      var dx = bx - ax, dy = by - ay, r = ar + br;
      return dx * dx + dy * dy < r * r;
    },
    aabbHit: function (ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    },
    pointInRect: function (px, py, x, y, w, h) { return px >= x && py >= y && px < x + w && py < y + h; },
    fmtMoney: function (n) {
      n = Math.round(n || 0);
      var neg = n < 0; n = Math.abs(n);
      var s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return (neg ? '-$' : '$') + s;
    },
    fmtClock: function (clock) {
      var h = Math.floor(clock) % 24, m = Math.floor((clock % 1) * 60);
      return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    },
    pad: function (n, w) { var s = String(n); while (s.length < w) s = '0' + s; return s; },
    now: function () { return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now(); },
    // tiny color helpers for procedural art
    rgba: function (r, g, b, a) { return 'rgba(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ',' + (a == null ? 1 : a) + ')'; },
    hexToRgb: function (hex) {
      hex = String(hex).replace('#', '');
      if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
      var n = parseInt(hex, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    },
    shade: function (hex, amt) { // amt in [-1,1]: darken (<0) or lighten (>0)
      var c = util.hexToRgb(hex);
      for (var i = 0; i < 3; i++) {
        c[i] = amt < 0 ? c[i] * (1 + amt) : c[i] + (255 - c[i]) * amt;
        c[i] = util.clamp(Math.round(c[i]), 0, 255);
      }
      return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
    },
    mix: function (hexA, hexB, t) {
      var a = util.hexToRgb(hexA), b = util.hexToRgb(hexB);
      return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')';
    },
    // push an error into GTP.errors without throwing
    reportError: function (e, where) {
      var msg = (e && e.message) ? e.message : String(e);
      GTP.errors.push({ time: Date.now(), where: where || '', message: msg, stack: e && e.stack ? String(e.stack) : '' });
      if (GTP.errors.length > 200) GTP.errors.shift();
      if (typeof console !== 'undefined' && console.error) console.error('[GTP]', where || '', e);
    }
  };

  // ---------------------------------------------------------------- Vec ----
  GTP.Vec = {
    len: function (x, y) { return Math.sqrt(x * x + y * y); },
    norm: function (x, y) { var l = Math.sqrt(x * x + y * y) || 1; return { x: x / l, y: y / l }; },
    dot: function (ax, ay, bx, by) { return ax * bx + ay * by; },
    cross: function (ax, ay, bx, by) { return ax * by - ay * bx; },
    rot: function (x, y, a) { var c = Math.cos(a), s = Math.sin(a); return { x: x * c - y * s, y: x * s + y * c }; },
    fromAngle: function (a, l) { l = l == null ? 1 : l; return { x: Math.cos(a) * l, y: Math.sin(a) * l }; }
  };

  // -------------------------------------------------------- SpatialHash ----
  // Uniform grid hash for entity queries. Entities need x, y, radius and get a
  // private _sh field storing the cells they were inserted into.
  function SpatialHash(cellSize) {
    this.cell = cellSize || 128;
    this.map = new Map();
    this._stamp = 1;
  }
  SpatialHash.prototype._key = function (cx, cy) { return cx * 73856093 ^ cy * 19349663; };
  SpatialHash.prototype._cellsFor = function (e) {
    var r = e.radius || 8, c = this.cell;
    var x0 = Math.floor((e.x - r) / c), y0 = Math.floor((e.y - r) / c);
    var x1 = Math.floor((e.x + r) / c), y1 = Math.floor((e.y + r) / c);
    var out = [];
    for (var cy = y0; cy <= y1; cy++) for (var cx = x0; cx <= x1; cx++) out.push(this._key(cx, cy));
    return out;
  };
  SpatialHash.prototype.insert = function (e) {
    var keys = this._cellsFor(e);
    e._sh = keys;
    for (var i = 0; i < keys.length; i++) {
      var b = this.map.get(keys[i]);
      if (!b) { b = []; this.map.set(keys[i], b); }
      b.push(e);
    }
  };
  SpatialHash.prototype.remove = function (e) {
    var keys = e._sh;
    if (!keys) return;
    for (var i = 0; i < keys.length; i++) {
      var b = this.map.get(keys[i]);
      if (!b) continue;
      var idx = b.indexOf(e);
      if (idx >= 0) { b[idx] = b[b.length - 1]; b.pop(); }
      if (!b.length) this.map.delete(keys[i]);
    }
    e._sh = null;
  };
  SpatialHash.prototype.update = function (e) {
    var keys = this._cellsFor(e), old = e._sh;
    if (old && old.length === keys.length) {
      var same = true;
      for (var i = 0; i < keys.length; i++) if (keys[i] !== old[i]) { same = false; break; }
      if (same) return;
    }
    this.remove(e);
    this.insert(e);
  };
  SpatialHash.prototype.query = function (x, y, r, out) {
    out = out || [];
    out.length = 0;
    var c = this.cell, stamp = ++this._stamp;
    var x0 = Math.floor((x - r) / c), y0 = Math.floor((y - r) / c);
    var x1 = Math.floor((x + r) / c), y1 = Math.floor((y + r) / c);
    for (var cy = y0; cy <= y1; cy++) for (var cx = x0; cx <= x1; cx++) {
      var b = this.map.get(this._key(cx, cy));
      if (!b) continue;
      for (var i = 0; i < b.length; i++) {
        var e = b[i];
        if (e._qs === stamp) continue;
        e._qs = stamp;
        var dx = e.x - x, dy = e.y - y, rr = r + (e.radius || 0);
        if (dx * dx + dy * dy <= rr * rr) out.push(e);
      }
    }
    return out;
  };
  SpatialHash.prototype.queryRect = function (x, y, w, h, out) {
    out = out || [];
    out.length = 0;
    var c = this.cell, stamp = ++this._stamp;
    var x0 = Math.floor(x / c), y0 = Math.floor(y / c), x1 = Math.floor((x + w) / c), y1 = Math.floor((y + h) / c);
    for (var cy = y0; cy <= y1; cy++) for (var cx = x0; cx <= x1; cx++) {
      var b = this.map.get(this._key(cx, cy));
      if (!b) continue;
      for (var i = 0; i < b.length; i++) {
        var e = b[i];
        if (e._qs === stamp) continue;
        e._qs = stamp;
        var r = e.radius || 0;
        if (e.x + r >= x && e.x - r <= x + w && e.y + r >= y && e.y - r <= y + h) out.push(e);
      }
    }
    return out;
  };
  SpatialHash.prototype.clear = function () { this.map.clear(); };
  GTP.SpatialHash = SpatialHash;

  // ------------------------------------------------------------- BinHeap ----
  // Minimal binary heap used by World.findPath (A*).
  function BinHeap(scoreFn) { this.items = []; this.score = scoreFn; }
  BinHeap.prototype.push = function (v) {
    var a = this.items, i = a.length; a.push(v);
    while (i > 0) {
      var p = (i - 1) >> 1;
      if (this.score(a[p]) <= this.score(a[i])) break;
      var t = a[p]; a[p] = a[i]; a[i] = t; i = p;
    }
  };
  BinHeap.prototype.pop = function () {
    var a = this.items, top = a[0], last = a.pop();
    if (a.length) {
      a[0] = last;
      var i = 0, n = a.length;
      for (;;) {
        var l = 2 * i + 1, r = l + 1, m = i;
        if (l < n && this.score(a[l]) < this.score(a[m])) m = l;
        if (r < n && this.score(a[r]) < this.score(a[m])) m = r;
        if (m === i) break;
        var t = a[m]; a[m] = a[i]; a[i] = t; i = m;
      }
    }
    return top;
  };
  BinHeap.prototype.size = function () { return this.items.length; };
  GTP.BinHeap = BinHeap;
})();

</script>
<script>
/* js/01_config.js */
/* Grand Theft Pundit: 01_config.js
 * GTP.C: every tunable constant and the render palette. Numbers here are the
 * knobs that change how the game feels; code elsewhere reads them, never
 * hard-codes them.
 */
(function () {
  'use strict';
  var GTP = window.GTP = window.GTP || {};

  var C = GTP.C = {
    // --- world geometry ---------------------------------------------------
    TILE: 32,                 // px per tile
    MAP_W: 128,               // tiles
    MAP_H: 128,               // tiles
    VIEW_W: 1280,             // logical viewport px
    VIEW_H: 720,
    STEP: 1 / 60,             // fixed simulation step (s)
    MAX_STEPS: 5,             // max steps per animation frame before dropping time
    MAX_FRAME_DT: 0.25,       // clamp wall-clock dt (s) when the tab stalls
    ACTIVE_RADIUS: 1600,      // px from player beyond which dynamic entities despawn
    CHUNK_TILES: 16,          // chunk cache: tiles per chunk edge (512 px)
    CHUNK_CACHE_MAX: 40,      // LRU cap on cached chunk canvases
    MAX_DPR: 2,               // cap devicePixelRatio for the backing store

    // --- camera -----------------------------------------------------------
    CAMERA: {
      smooth: 7,              // exponential follow rate (higher = snappier)
      leadFoot: 0.35,         // seconds of velocity to lead on foot
      leadVehicle: 0.75,      // seconds of velocity to lead in a vehicle
      maxLead: 260,           // px cap on lead offset
      zoomFoot: 1,
      zoomVehicle: 0.85,      // slight zoom-out while driving
      zoomSmooth: 2.5,
      shakeDecay: 6
    },

    // --- day clock --------------------------------------------------------
    DAY: {
      startClock: 10.5,       // hours (0..24) at new game
      secondsPerHour: 60,     // 1 game hour = 60 real seconds
      duskStart: 18.0,        // night ramps 0 -> 1 between dusk and dark
      darkStart: 21.0,
      dawnStart: 5.0,         // night ramps 1 -> 0 between dawn and day
      dayStart: 7.0
    },

    // --- player / peds ----------------------------------------------------
    PLAYER: { walk: 70, run: 140, radius: 9, hp: 100, accel: 900, startMoney: 250 },
    PED: { walk: 70, run: 140, radius: 8, hp: 60, separation: 14, knockdownSpeed: 60 },

    // --- vehicles ---------------------------------------------------------
    // w = length along heading, h = width. Speeds in px/s, accel px/s^2,
    // turnRate rad/s at full steer, grip 0..1 = fraction of lateral velocity
    // removed per second scaled (handbrake lowers it).
    VEHICLES: {
      sedan:  { accel: 220, maxSpeed: 330, brake: 520, reverse: 120, turnRate: 2.6, grip: 0.86, hp: 100, w: 44, h: 22, seats: 4, mass: 1.0, colors: ['#c94040', '#3d6fcf', '#d8d8d8', '#2b2b2b', '#7a5c3a', '#2f9e6a', '#e8b53a'] },
      sports: { accel: 320, maxSpeed: 440, brake: 560, reverse: 130, turnRate: 3.0, grip: 0.9,  hp: 80,  w: 42, h: 20, seats: 2, mass: 0.9, colors: ['#ff2d6f', '#ffd400', '#15e0ff', '#1a1a1a', '#ff7a00'] },
      suv:    { accel: 200, maxSpeed: 310, brake: 500, reverse: 110, turnRate: 2.3, grip: 0.84, hp: 140, w: 48, h: 24, seats: 4, mass: 1.3, colors: ['#1d1d1d', '#5c5c5c', '#8a2f2f', '#2a4a6e', '#e6e6e6'] },
      truck:  { accel: 140, maxSpeed: 260, brake: 420, reverse: 90,  turnRate: 1.8, grip: 0.8,  hp: 220, w: 64, h: 26, seats: 2, mass: 2.2, colors: ['#9c9c9c', '#b65a1f', '#2d5f8a', '#4c4c4c'] },
      van:    { accel: 170, maxSpeed: 280, brake: 460, reverse: 100, turnRate: 2.1, grip: 0.82, hp: 160, w: 52, h: 24, seats: 3, mass: 1.5, colors: ['#f2f2f2', '#2c3e7a', '#8e3a8e', '#3a8e5e', '#d14b4b'] },
      cop:    { accel: 280, maxSpeed: 400, brake: 560, reverse: 130, turnRate: 2.9, grip: 0.9,  hp: 120, w: 46, h: 22, seats: 4, mass: 1.1, colors: ['#f4f4f4'] },
      taxi:   { accel: 230, maxSpeed: 340, brake: 520, reverse: 120, turnRate: 2.7, grip: 0.86, hp: 100, w: 44, h: 22, seats: 4, mass: 1.0, colors: ['#ffc21a'] },
      bus:    { accel: 110, maxSpeed: 230, brake: 380, reverse: 80,  turnRate: 1.5, grip: 0.8,  hp: 300, w: 80, h: 26, seats: 8, mass: 3.0, colors: ['#e8e2c8', '#3b7bd3'] },
      bike:   { accel: 300, maxSpeed: 380, brake: 480, reverse: 60,  turnRate: 3.6, grip: 0.95, hp: 40,  w: 26, h: 12, seats: 1, mass: 0.4, colors: ['#1a1a1a', '#c0392b', '#f1c40f'] }
    },

    // --- wanted / police (AI module reads these) --------------------------
    WANTED: {
      thresholds: [2, 6, 12, 20, 30],
      decayDelay: 4,          // seconds without cop LOS before heat decays
      decayRate: 1.2,         // heat per second once decaying
      heat: { hitPed: 1, killPed: 3, shootNearCop: 2, stealOccupied: 2, stealSeen: 1, destroyVehicle: 3, attackCop: 5 },
      sprayCost: 300
    },

    // --- spawner budgets --------------------------------------------------
    SPAWN: { peds: 60, vehicles: 30, pedRadius: [500, 1100], vehicleRadius: [600, 1300] },

    // --- palette ----------------------------------------------------------
    // The city is a neon-noir cable-news town: cool asphalt, warm sodium
    // light, saturated roof colors per district, teal water.
    PAL: {
      bg: '#06070d',
      void: '#04050a',
      road: '#2c2f38',
      roadDark: '#262930',
      roadLine: '#d9d6c8',
      roadLineYellow: '#e6b63c',
      roadCrosswalk: '#e4e2d6',
      highway: '#30333c',
      shoulder: '#5a5d66',
      barrier: '#9ea3ad',
      sidewalk: '#8f919a',
      sidewalkLine: '#7d8089',
      curb: '#5e616a',
      curbLight: '#b2b5bd',
      grass: '#3f7a3a',
      grassDark: '#356b31',
      grassLight: '#4c8a44',
      sand: '#d8c48a',
      sandDark: '#c7b277',
      water: '#1b5a7a',
      waterDeep: '#154a66',
      waterLight: '#2f7fa4',
      foam: '#b9e6f4',
      parking: '#45484f',
      parkingLine: '#d0cfc5',
      plaza: '#a6a3a0',
      plazaLine: '#948f8c',
      dock: '#8a6a44',
      dockLine: '#6e5436',
      bridge: '#4a4d57',
      bridgeRail: '#c3c6cc',
      shadow: 'rgba(0,0,0,0.38)',
      wall: '#1f2128',
      treeShadow: 'rgba(0,0,0,0.3)',
      tree: ['#2f6b2c', '#3a7d34', '#2c7a4a', '#5b7f2a'],
      treeLight: ['#4f9a44', '#5aa64e', '#48a06a', '#86ad3c'],
      lamp: '#c9ccd4',
      lampGlow: 'rgba(255,196,90,0.55)',
      night: 'rgba(18,22,66,1)',
      buildingRoofs: {
        downtown: ['#4a4f63', '#3c4258', '#555a70', '#2f3346', '#61677f', '#434a66'],
        office: ['#6a6150', '#5f5a4e', '#73685a', '#5a554b'],
        campus: ['#8a4a3a', '#95553f', '#7e4536', '#a06a4a'],

  }

      World.props.push({ type: 'crane', x: (lot.x + lot.w * 0.7) * TILE, y: (lot.y + lot.h - 0.5) * TILE, len: 150 });

  };

    // -------------------------------------------------------------- camera --
    snapCamera: function () {
      var g = GTP.game, p = g && g.player; if (!p) return;
      Render.cam.x = Render.cam._px = p.x; Render.cam.y = Render.cam._py = p.y;
    },
    updateCamera: function (dt) {
      var cam = Render.cam;
      cam._px = cam.x; cam._py = cam.y;
      if (cam.shake > 0) cam.shake = Math.max(0, cam.shake - cam.shake * C.CAMERA.shakeDecay * dt - 2 * dt);
      if (cam.free) return;
      var g = GTP.game, p = g && g.player; if (!p) return;
      var K = C.CAMERA, veh = p.vehicle;
      var vx = veh ? veh.vx : p.vx, vy = veh ? veh.vy : p.vy;
      var lead = veh ? K.leadVehicle : K.leadFoot;
      var lx = U.clamp(vx * lead, -K.maxLead, K.maxLead), ly = U.clamp(vy * lead, -K.maxLead, K.maxLead);
      var fx = veh ? veh.x : p.x, fy = veh ? veh.y : p.y;
      var k = 1 - Math.exp(-K.smooth * dt);
      cam.x += (fx + lx - cam.x) * k;
      cam.y += (fy + ly - cam.y) * k;
      var tz = cam.targetZoom || (veh ? K.zoomVehicle : K.zoomFoot);
      cam.zoom += (tz - cam.zoom) * (1 - Math.exp(-K.zoomSmooth * dt));
      // keep the view inside the map
      var hw = VW / 2 / cam.zoom, hh = VH / 2 / cam.zoom;
      var mw = W.w * TILE, mh = W.h * TILE;
      cam.x = U.clamp(cam.x, Math.min(hw, mw / 2), Math.max(mw - hw, mw / 2));
      cam.y = U.clamp(cam.y, Math.min(hh, mh / 2), Math.max(mh - hh, mh / 2));
    },

    // --------------------------------------------------------------- frame --
    frame: function (alpha) {
      var ctx = Render.ctx; if (!ctx) return;
      var t0 = U.now();
      if (alpha == null) alpha = 1;
      var cam = Render.cam;
      var cx = U.lerp(cam._px, cam.x, alpha), cy = U.lerp(cam._py, cam.y, alpha), z = cam.zoom;
      if (cam.free) { cx = cam.x; cy = cam.y; }
      if (cam.shake > 0) {
        var s = cam.shake, tt = Render.time * 60;
        cx += Math.sin(tt * 1.7) * s; cy += Math.cos(tt * 2.3) * s;
      }
      // pixel-snap the camera in screen space to avoid chunk shimmer
      cx = Math.round(cx * z) / z; cy = Math.round(cy * z) / z;
      var g = GTP.game;
      if (g && g.time) Render.night = Render.nightFromClock(g.time.clock);
      Render.time = (g && g.time) ? g.time.t : Render.time;

      ctx.setTransform(Render.scale * Render.dpr, 0, 0, Render.scale * Render.dpr, Render.offX * Render.dpr, Render.offY * Render.dpr);
      // letterbox fill
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = PAL.bg;
      ctx.fillRect(0, 0, Render.canvas.width, Render.canvas.height);
      ctx.restore();

      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
      ctx.translate(VW / 2, VH / 2);
      ctx.scale(z, z);
      ctx.translate(-cx, -cy);
      var view = { x: cx - VW / 2 / z, y: cy - VH / 2 / z, w: VW / z, h: VH / z };
      Render.drawWorld(ctx, view);
      Render.drawMarkers(ctx, view);
      Render.drawEntities(ctx, view, alpha);
      Render.fx.draw(ctx, view);
      Render.drawNight(ctx, view);
      if (g && g.debugMode) Render.drawDebugWorld(ctx, view);
      ctx.restore();

      // screen-space layers
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
      if (GTP.UI && GTP.UI.draw) { try { GTP.UI.draw(ctx); } catch (e) { U.reportError(e, 'ui.draw'); } }
      if (g && g.debugMode) Render.drawDebugHud(ctx);
      ctx.restore();
      Render.lights.length = 0;
      Render.stats.frameMs = U.now() - t0;
    },

    nightFromClock: function (c) {
      var D = C.DAY;
      if (c >= D.darkStart || c < D.dawnStart) return 1;
      if (c >= D.duskStart) return U.smoothstep((c - D.duskStart) / (D.darkStart - D.duskStart));
      if (c < D.dayStart) return 1 - U.smoothstep((c - D.dawnStart) / (D.dayStart - D.dawnStart));
      return 0;
    },

    // ---------------------------------------------------------- chunk cache --
    invalidateAll: function () { Render.chunks.clear(); Render._buckets = null; },
    invalidateChunk: function (cx, cy) { Render.chunks.delete(cy * 4096 + cx); },
    _buildBuckets: function () {
      var nx = Math.ceil(W.w / CH), ny = Math.ceil(W.h / CH);
      var B = Render._buckets = { nx: nx, ny: ny, buildings: [], props: [], lots: [] };
      for (var i = 0; i < nx * ny; i++) { B.buildings.push([]); B.props.push([]); B.lots.push([]); }
      function put(list, x0, y0, x1, y1, item) {
        var cx0 = Math.max(0, Math.floor(x0 / CHPX)), cy0 = Math.max(0, Math.floor(y0 / CHPX));
        var cx1 = Math.min(nx - 1, Math.floor(x1 / CHPX)), cy1 = Math.min(ny - 1, Math.floor(y1 / CHPX));
        for (var cy = cy0; cy <= cy1; cy++) for (var cx = cx0; cx <= cx1; cx++) list[cy * nx + cx].push(item);
      }
      W.buildings.forEach(function (b) { put(B.buildings, b.x - 8, b.y - 8, b.x + b.w + 48, b.y + b.h + 48, b); });
      W.props.forEach(function (p) { var r = (p.len || p.w || p.r || 24) + 40; put(B.props, p.x - r, p.y - r, p.x + r, p.y + r, p); });
      W.lots.forEach(function (l) { put(B.lots, l.x, l.y, l.x + l.w, l.y + l.h, l); });
    },
    getChunk: function (cx, cy) {
      var key = cy * 4096 + cx, ch = Render.chunks.get(key);
      if (ch) { Render.chunks.delete(key); Render.chunks.set(key, ch); return ch; }
      ch = Render.paintChunk(cx, cy);
      Render.chunks.set(key, ch);
      while (Render.chunks.size > C.CHUNK_CACHE_MAX) {
        var first = Render.chunks.keys().next().value;
        Render.chunks.delete(first);
      }
      return ch;
    },
    drawWorld: function (ctx, view) {
      if (!W || !W.tiles) return;
      var cx0 = Math.floor(view.x / CHPX), cy0 = Math.floor(view.y / CHPX);
      var cx1 = Math.floor((view.x + view.w) / CHPX), cy1 = Math.floor((view.y + view.h) / CHPX);
      var nx = Math.ceil(W.w / CH), ny = Math.ceil(W.h / CH);
      ctx.fillStyle = PAL.waterDeep;
      ctx.fillRect(view.x - 4, view.y - 4, view.w + 8, view.h + 8);
      for (var cy = cy0; cy <= cy1; cy++) for (var cx = cx0; cx <= cx1; cx++) {
        if (cx < 0 || cy < 0 || cx >= nx || cy >= ny) continue;
        var ch = Render.getChunk(cx, cy);
        ctx.drawImage(ch, cx * CHPX, cy * CHPX);
      }
    },

    paintChunk: function (cx, cy) {
      if (!Render._buckets) Render._buildBuckets();
      Render.stats.chunkPaints++;
      var cv = makeCanvas(CHPX, CHPX), ctx = cv.getContext('2d');
      var ox = cx * CHPX, oy = cy * CHPX;
      ctx.translate(-ox, -oy);
      var tx0 = cx * CH, ty0 = cy * CH;
      var tx, ty;
      // pass 1: ground tiles
      for (ty = ty0; ty < ty0 + CH; ty++) for (tx = tx0; tx < tx0 + CH; tx++) Render.paintTile(ctx, tx, ty);
      // pass 2: curbs + road markings (need neighbours)
      for (ty = ty0; ty < ty0 + CH; ty++) for (tx = tx0; tx < tx0 + CH; tx++) Render.paintTileOverlay(ctx, tx, ty);
      var B = Render._buckets, bi = cy * B.nx + cx;
      // pass 3: parking bays
      var lots = B.lots[bi];
      for (var i = 0; i < lots.length; i++) Render.paintLot(ctx, lots[i]);
      // pass 4: building shadows, then roofs
      var blds = B.buildings[bi];
      for (i = 0; i < blds.length; i++) Render.paintShadow(ctx, blds[i]);
      for (i = 0; i < blds.length; i++) Render.paintBuilding(ctx, blds[i]);
      // pass 5: props
      var props = B.props[bi];
      for (i = 0; i < props.length; i++) Render.paintProp(ctx, props[i]);
      return cv;
    },

    // --------------------------------------------------------------- tiles --
    paintTile: function (ctx, tx, ty) {
      var t = W.tile(tx, ty), x = tx * TILE, y = ty * TILE;
      var m = W.metaAt(tx, ty), hv = U.hash2(tx, ty, 1);
      switch (t) {
        case T.VOID: ctx.fillStyle = PAL.void; ctx.fillRect(x, y, TILE, TILE); break;
        case T.WATER: Render.paintWater(ctx, tx, ty, x, y, hv); break;
        case T.GRASS:
          ctx.fillStyle = hv < 0.33 ? PAL.grass : hv < 0.66 ? PAL.grassDark : PAL.grassLight;
          ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = PAL.grass; ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = 'rgba(0,0,0,' + (0.04 + hv * 0.06) + ')'; ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = PAL.grassLight;
          for (var k = 0; k < 4; k++) { var hx = U.hash2(tx, ty, 20 + k), hy = U.hash2(tx, ty, 30 + k); ctx.fillRect(x + (hx * 28) | 0, y + (hy * 28) | 0, 2, 2); }
          ctx.fillStyle = PAL.grassDark;
          for (k = 0; k < 3; k++) { hx = U.hash2(tx, ty, 40 + k); hy = U.hash2(tx, ty, 50 + k); ctx.fillRect(x + (hx * 28) | 0, y + (hy * 28) | 0, 3, 2); }
          break;
        case T.SAND:
          ctx.fillStyle = PAL.sand; ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = 'rgba(0,0,0,' + (hv * 0.05) + ')'; ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = PAL.sandDark;
          for (k = 0; k < 5; k++) { hx = U.hash2(tx, ty, 60 + k); hy = U.hash2(tx, ty, 70 + k); ctx.fillRect(x + (hx * 30) | 0, y + (hy * 30) | 0, 2, 2); }
          break;
        case T.SIDEWALK:
          if (m & M.SHOULDER) { ctx.fillStyle = PAL.shoulder; ctx.fillRect(x, y, TILE, TILE); ctx.fillStyle = 'rgba(0,0,0,' + (hv * 0.08) + ')'; ctx.fillRect(x, y, TILE, TILE); }
          else {
            ctx.fillStyle = PAL.sidewalk; ctx.fillRect(x, y, TILE, TILE);
            ctx.fillStyle = 'rgba(0,0,0,' + (hv * 0.07) + ')'; ctx.fillRect(x, y, TILE, TILE);
            ctx.fillStyle = PAL.sidewalkLine;
            ctx.fillRect(x + 15, y, 1, TILE); ctx.fillRect(x, y + 15, TILE, 1);
            if (hv > 0.9) { ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fillRect(x + 4, y + 20, 10, 1); ctx.fillRect(x + 13, y + 21, 6, 1); }
          }
          break;
        case T.PLAZA:
          if (m & M.DOCK) Render.paintDock(ctx, tx, ty, x, y);
          else {
            var path = (m & M.PATH) !== 0;
            ctx.fillStyle = path ? '#b7a98a' : PAL.plaza; ctx.fillRect(x, y, TILE, TILE);
            ctx.fillStyle = 'rgba(0,0,0,' + (hv * 0.06) + ')'; ctx.fillRect(x, y, TILE, TILE);
            ctx.fillStyle = path ? '#a4967a' : PAL.plazaLine;
            ctx.fillRect(x + 15, y, 1, TILE); ctx.fillRect(x, y + 15, TILE, 1);
          }
          break;
        case T.PARKING:
          ctx.fillStyle = PAL.parking; ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = 'rgba(0,0,0,' + (hv * 0.06) + ')'; ctx.fillRect(x, y, TILE, TILE);
          break;
        case T.ROAD:
          ctx.fillStyle = (m & M.HIGHWAY) ? PAL.highway : PAL.road; ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = 'rgba(0,0,0,' + (hv * 0.05) + ')'; ctx.fillRect(x, y, TILE, TILE);
          if (hv > 0.93) { ctx.fillStyle = PAL.roadDark; ctx.fillRect(x + ((hv * 50) % 14 | 0), y + ((hv * 90) % 14 | 0), 10 + (hv * 10 | 0), 6); }
          break;
        case T.BRIDGE:
          ctx.fillStyle = PAL.bridge; ctx.fillRect(x, y, TILE, TILE);
          ctx.fillStyle = 'rgba(0,0,0,' + (hv * 0.05) + ')'; ctx.fillRect(x, y, TILE, TILE);
          break;
        case T.BUILDING:
          ctx.fillStyle = PAL.wall; ctx.fillRect(x, y, TILE, TILE);
          break;
        default:
          ctx.fillStyle = PAL.void; ctx.fillRect(x, y, TILE, TILE);
      }
    },
    paintWater: function (ctx, tx, ty, x, y, hv) {
      ctx.fillStyle = PAL.water; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = 'rgba(0,0,0,' + (hv * 0.08) + ')'; ctx.fillRect(x, y, TILE, TILE);
      // ripples
      ctx.fillStyle = 'rgba(120,200,230,0.28)';
      for (var k = 0; k < 2; k++) {
        var hx = U.hash2(tx, ty, 80 + k), hy = U.hash2(tx, ty, 90 + k);
        ctx.fillRect(x + (hx * 20) | 0, y + (hy * 30) | 0, 6 + (hx * 8) | 0, 1);
      }
      // shoreline foam / shadows from decks
      var n = [W.tile(tx, ty - 1), W.tile(tx + 1, ty), W.tile(tx, ty + 1), W.tile(tx - 1, ty)];
      var nm = [W.metaAt(tx, ty - 1), W.metaAt(tx + 1, ty), W.metaAt(tx, ty + 1), W.metaAt(tx - 1, ty)];
      for (k = 0; k < 4; k++) {
        var nt = n[k];
        if (nt === T.WATER || nt === T.VOID) continue;
        var deck = nt === T.BRIDGE || ((nm[k] & M.DOCK) !== 0);
        var ex = x, ey = y, ew = TILE, eh = TILE;
        if (deck) {
          ctx.fillStyle = 'rgba(0,0,0,0.28)';
          if (k === 0) ctx.fillRect(x, y, TILE, 7); else if (k === 1) ctx.fillRect(x + TILE - 7, y, 7, TILE);
          else if (k === 2) ctx.fillRect(x, y + TILE - 7, TILE, 7); else ctx.fillRect(x, y, 7, TILE);
          continue;
        }
        if (k === 0) { eh = 6; } else if (k === 1) { ex = x + TILE - 6; ew = 6; } else if (k === 2) { ey = y + TILE - 6; eh = 6; } else { ew = 6; }
        ctx.fillStyle = 'rgba(80,160,200,0.55)'; ctx.fillRect(ex, ey, ew, eh);
        ctx.fillStyle = PAL.foam;
        if (k === 0) ctx.fillRect(x, y, TILE, 2); else if (k === 1) ctx.fillRect(x + TILE - 2, y, 2, TILE);
        else if (k === 2) ctx.fillRect(x, y + TILE - 2, TILE, 2); else ctx.fillRect(x, y, 2, TILE);
      }
    },
    paintDock: function (ctx, tx, ty, x, y) {
      ctx.fillStyle = PAL.dock; ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = PAL.dockLine;
      for (var k = 5; k < TILE; k += 6) ctx.fillRect(x, y + k, TILE, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x, y, 2, TILE); ctx.fillRect(x + TILE - 2, y, 2, TILE);
      if (ty % 2 === 0) { ctx.fillStyle = '#4a3a26'; ctx.fillRect(x - 1, y + 2, 4, 4); ctx.fillRect(x + TILE - 3, y + 2, 4, 4); }
    },

    paintTileOverlay: function (ctx, tx, ty) {
      var t = W.tile(tx, ty), x = tx * TILE, y = ty * TILE;
      if (t === T.ROAD || t === T.BRIDGE) { Render.paintRoadMarkings(ctx, tx, ty, x, y, t); return; }
      if (t === T.BUILDING || t === T.WATER || t === T.VOID) return;
      var m = W.metaAt(tx, ty);
      var n = [W.tile(tx, ty - 1), W.tile(tx + 1, ty), W.tile(tx, ty + 1), W.tile(tx - 1, ty)];
      if (m & M.DOCK) return;
      // curb against roads
      for (var k = 0; k < 4; k++) {
        if (!W.isRoadTile(n[k])) continue;
        if (m & M.SHOULDER) continue;
        ctx.fillStyle = PAL.curb;
        if (k === 0) ctx.fillRect(x, y, TILE, 2); else if (k === 1) ctx.fillRect(x + TILE - 2, y, 2, TILE);
        else if (k === 2) ctx.fillRect(x, y + TILE - 2, TILE, 2); else ctx.fillRect(x, y, 2, TILE);
        ctx.fillStyle = PAL.curbLight;
        if (k === 0) ctx.fillRect(x, y + 2, TILE, 1); else if (k === 1) ctx.fillRect(x + TILE - 3, y, 1, TILE);
        else if (k === 2) ctx.fillRect(x, y + TILE - 3, TILE, 1); else ctx.fillRect(x + 2, y, 1, TILE);
      }
      // highway shoulder barrier on the side facing away from the road
      if (m & M.SHOULDER) {
        var nm = [W.metaAt(tx, ty - 1), W.metaAt(tx + 1, ty), W.metaAt(tx, ty + 1), W.metaAt(tx - 1, ty)];
        for (k = 0; k < 4; k++) {
          var nt = n[k];
          if (W.isRoadTile(nt) || (nm[k] & M.SHOULDER)) continue;
          if (nt === T.WATER) continue;
          var opp = (k + 2) % 4;
          if (!W.isRoadTile(n[opp]) && !(nm[opp] & M.SHOULDER)) continue;
          ctx.fillStyle = PAL.barrier;
          if (k === 0) ctx.fillRect(x, y, TILE, 5); else if (k === 1) ctx.fillRect(x + TILE - 5, y, 5, TILE);
          else if (k === 2) ctx.fillRect(x, y + TILE - 5, TILE, 5); else ctx.fillRect(x, y, 5, TILE);
          ctx.fillStyle = 'rgba(0,0,0,0.35)';
          if (k === 0) ctx.fillRect(x, y + 5, TILE, 1); else if (k === 1) ctx.fillRect(x + TILE - 6, y, 1, TILE);
          else if (k === 2) ctx.fillRect(x, y + TILE - 6, TILE, 1); else ctx.fillRect(x + 5, y, 1, TILE);
          ctx.fillStyle = 'rgba(255,255,255,0.35)';
          if (k === 0) ctx.fillRect(x, y + 1, TILE, 1); else if (k === 1) ctx.fillRect(x + TILE - 2, y, 1, TILE);
          else if (k === 2) ctx.fillRect(x, y + TILE - 2, TILE, 1); else ctx.fillRect(x + 1, y, 1, TILE);
        }
      }
    },

    paintRoadMarkings: function (ctx, tx, ty, x, y, t) {
      var i = ty * W.w + tx, m = W.meta[i], h = W.laneH[i], v = W.laneV[i];
      var isX = h && v, hw = h & 15, vw = v & 15;
      var highway = (m & M.HIGHWAY) !== 0, avenue = (m & M.AVENUE) !== 0;
      if (t === T.BRIDGE) {
        // railings against water
        var n = [W.tile(tx, ty - 1), W.tile(tx + 1, ty), W.tile(tx, ty + 1), W.tile(tx - 1, ty)];
        for (var k = 0; k < 4; k++) {
          if (n[k] !== T.WATER) continue;
          ctx.fillStyle = PAL.bridgeRail;
          if (k === 0) ctx.fillRect(x, y, TILE, 3); else if (k === 1) ctx.fillRect(x + TILE - 3, y, 3, TILE);
          else if (k === 2) ctx.fillRect(x, y + TILE - 3, TILE, 3); else ctx.fillRect(x, y, 3, TILE);
          ctx.fillStyle = '#6a6e78';
          for (var p = 2; p < TILE; p += 8) {
            if (k === 0) ctx.fillRect(x + p, y, 2, 5); else if (k === 1) ctx.fillRect(x + TILE - 5, y + p, 5, 2);
            else if (k === 2) ctx.fillRect(x + p, y + TILE - 5, 2, 5); else ctx.fillRect(x, y + p, 5, 2);
          }
        }
      }
      if (isX) return;
      if (h) {
        var lane = h >> 4, w = hw;
        if (m & M.CROSSWALK) {
          ctx.fillStyle = PAL.roadCrosswalk;
          for (k = 0; k < 4; k++) ctx.fillRect(x + 3, y + 3 + k * 8, TILE - 6, 4);
          var xr = W._isX(W.metaAt(tx + 1, ty)), xl = W._isX(W.metaAt(tx - 1, ty));
          ctx.fillStyle = PAL.roadLine;
          if (xr && lane >= w / 2) ctx.fillRect(x, y + 1, 3, TILE - 2);
          if (xl && lane < w / 2) ctx.fillRect(x + TILE - 3, y + 1, 3, TILE - 2);
          return;
        }
        if (w === 2) {
          if (lane === 0) { ctx.fillStyle = PAL.roadLineYellow; ctx.fillRect(x + 4, y + TILE - 2, 16, 2); }
        } else {
          if (lane === w / 2 - 1) {
            if (highway) {
              ctx.fillStyle = PAL.shoulder; ctx.fillRect(x, y + TILE - 3, TILE, 3);
              ctx.fillStyle = PAL.roadLineYellow; ctx.fillRect(x, y + TILE - 5, TILE, 2);
            } else { ctx.fillStyle = PAL.roadLineYellow; ctx.fillRect(x, y + TILE - 5, TILE, 2); ctx.fillRect(x, y + TILE - 2, TILE, 2); }
          } else if (lane === w / 2 && highway) {
            ctx.fillStyle = PAL.shoulder; ctx.fillRect(x, y, TILE, 3);
            ctx.fillStyle = PAL.roadLineYellow; ctx.fillRect(x, y + 3, TILE, 2);
          } else if (lane === 0 || lane === w - 2) {
            ctx.fillStyle = PAL.roadLine; ctx.fillRect(x + 4, y + TILE - 1, 16, 2);
          }
          if (avenue || highway) {
            ctx.fillStyle = PAL.roadLine;
            if (lane === 0) ctx.fillRect(x, y + 2, TILE, 2);
            if (lane === w - 1) ctx.fillRect(x, y + TILE - 4, TILE, 2);
          }
        }
      } else if (v) {
        lane = v >> 4; w = vw;
        if (m & M.CROSSWALK) {
          ctx.fillStyle = PAL.roadCrosswalk;
          for (k = 0; k < 4; k++) ctx.fillRect(x + 3 + k * 8, y + 3, 4, TILE - 6);
          var xd = W._isX(W.metaAt(tx, ty + 1)), xu = W._isX(W.metaAt(tx, ty - 1));
          ctx.fillStyle = PAL.roadLine;
          if (xd && lane < w / 2) ctx.fillRect(x + 1, y, TILE - 2, 3);
          if (xu && lane >= w / 2) ctx.fillRect(x + 1, y + TILE - 3, TILE - 2, 3);
          return;
        }
        if (w === 2) {
          if (lane === 0) { ctx.fillStyle = PAL.roadLineYellow; ctx.fillRect(x + TILE - 2, y + 4, 2, 16); }
        } else {
          if (lane === w / 2 - 1) {
            if (highway) {
              ctx.fillStyle = PAL.shoulder; ctx.fillRect(x + TILE - 3, y, 3, TILE);

          ctx.fillStyle = '#ff3b30'; ctx.fillRect(-w / 2, -h / 2 + 2, 3, 4); ctx.fillRect(-w / 2, h / 2 - 6, 3, 4);
          if (type === 'cop') {
            ctx.fillStyle = '#1d3a8a'; ctx.fillRect(-w / 2 + 4, -h / 2 + 1, w - 8, 3); ctx.fillRect(-w / 2 + 4, h / 2 - 4, w - 8, 3);
            ctx.fillStyle = '#ff3b30'; ctx.fillRect(-4, -5, 4, 4); ctx.fillStyle = '#2e6bff'; ctx.fillRect(-4, 1, 4, 4);
          }
          if (type === 'taxi') { ctx.fillStyle = '#1a1a1a'; ctx.fillRect(-5, -4, 8, 8); ctx.fillStyle = '#ffe9a8'; ctx.fillRect(-4, -3, 6, 6); }
          void dark;
        });
      }
    },

    // ------------------------------------------------------------ entities --
    _drawList: [],
    drawEntities: function (ctx, view, alpha) {
      var E = GTP.Entities; if (!E) return;
      var list = E.list, dl = Render._drawList; dl.length = 0;
      var x0 = view.x - 80, y0 = view.y - 80, x1 = view.x + view.w + 80, y1 = view.y + view.h + 80;
      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (e.x < x0 || e.x > x1 || e.y < y0 || e.y > y1) continue;
        if (e.inVehicle) continue;
        dl.push(e);
      }
      dl.sort(function (a, b) { return (a.z - b.z) || (a.y - b.y) || (a.id - b.id); });
      Render.stats.drawnEntities = dl.length;
      for (i = 0; i < dl.length; i++) {
        e = dl[i];
        var ex = U.lerp(e._px == null ? e.x : e._px, e.x, alpha), ey = U.lerp(e._py == null ? e.y : e._py, e.y, alpha);
        var ea = e._pa == null ? e.angle : U.angleLerp(e._pa, e.angle, alpha);
        if (typeof e.draw === 'function') { try { e.draw(ctx, ex, ey, ea, alpha); } catch (err) { U.reportError(err, 'entity.draw'); } continue; }
        Render.drawEntityDefault(ctx, e, ex, ey, ea);
      }
    },
    drawEntityDefault: function (ctx, e, ex, ey, ea) {
      var k = e.kind;
      if (k === 'ped' || k === 'player') {
        var spr = Render.sprites.ped(e.look);
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ellipse(ctx, ex + 2, ey + 3, 7, 5); ctx.fill();
        ctx.save(); ctx.translate(ex, ey); ctx.rotate(ea);
        if (!e.alive) ctx.rotate(Math.PI / 2);
        ctx.drawImage(spr, -14, -14);
        ctx.restore();
        if (k === 'player') {
          // subtle marker ring so the player reads instantly
          ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(ex, ey, 11, 0, U.TAU); ctx.stroke();
        }
      } else if (k === 'vehicle') {
        var sv = Render.sprites.vehicle(e.type, e.color);
        ctx.save(); ctx.translate(ex, ey); ctx.rotate(ea);
        ctx.fillStyle = 'rgba(0,0,0,0.35)'; roundRect(ctx, -e.cls.w / 2 + 3, -e.cls.h / 2 + 4, e.cls.w, e.cls.h, 5); ctx.fill();
        ctx.drawImage(sv, -sv.width / 2, -sv.height / 2);
        ctx.restore();
        if (Render.night > 0.05 && e.headlights !== false) {
          Render.lights.push({ x: ex + Math.cos(ea) * e.cls.w * 0.5, y: ey + Math.sin(ea) * e.cls.w * 0.5, r: 70, a: ea, cone: 0.6, color: 'rgba(255,240,200,0.6)' });
        }
      } else if (k === 'projectile') {
        ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.arc(ex, ey, 2, 0, U.TAU); ctx.fill();
      } else if (k === 'pickup') {
        var bob = Math.sin(Render.time * 4 + e.id) * 2;
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ellipse(ctx, ex, ey + 6, 7, 3); ctx.fill();
        ctx.fillStyle = e.pickupType === 'cash' ? '#5bd16a' : e.pickupType === 'health' ? '#ff5f5f' : e.pickupType === 'armor' ? '#8fb6ff' : '#ffbe3c';
        ctx.fillRect(ex - 6, ey - 4 + bob, 12, 8);
        ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(ex - 5, ey - 3 + bob, 10, 2);
      } else {
        ctx.fillStyle = '#ff00ff'; ctx.beginPath(); ctx.arc(ex, ey, e.radius || 6, 0, U.TAU); ctx.fill();
      }
    },

    // ------------------------------------------------------------- markers --
    drawMarkers: function (ctx, view) {
      var ms = (GTP.Missions && GTP.Missions.markers && GTP.Missions.markers()) || [];
      var t = Render.time;
      for (var i = 0; i < ms.length; i++) {
        var m = ms[i];
        if (m.x < view.x - 60 || m.x > view.x + view.w + 60 || m.y < view.y - 80 || m.y > view.y + view.h + 60) continue;
        var pulse = 0.5 + 0.5 * Math.sin(t * 3 + i);
        if (m.kind === 'objective') {
          var bob = Math.sin(t * 4) * 4;
          ctx.fillStyle = 'rgba(0,0,0,0.25)'; ellipse(ctx, m.x, m.y, 10, 5); ctx.fill();
          ctx.fillStyle = '#ffbe3c'; ctx.beginPath(); ctx.moveTo(m.x, m.y - 8 + bob); ctx.lineTo(m.x - 9, m.y - 22 + bob); ctx.lineTo(m.x - 4, m.y - 22 + bob); ctx.lineTo(m.x - 4, m.y - 34 + bob); ctx.lineTo(m.x + 4, m.y - 34 + bob); ctx.lineTo(m.x + 4, m.y - 22 + bob); ctx.lineTo(m.x + 9, m.y - 22 + bob); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1; ctx.stroke();
        } else {
          var col = m.color || '#2ee6ff';
          ctx.fillStyle = col; ctx.globalAlpha = 0.18 + pulse * 0.1;
          ctx.fillRect(m.x - 22, m.y - 52, 44, 52);
          ctx.globalAlpha = 0.35 + pulse * 0.2; ellipse(ctx, m.x, m.y - 52, 22, 11); ctx.fill();
          ctx.globalAlpha = 0.5 + pulse * 0.3; ellipse(ctx, m.x, m.y, 22, 11); ctx.fill();
          ctx.globalAlpha = 1; ctx.strokeStyle = col; ctx.lineWidth = 2; ellipse(ctx, m.x, m.y, 22 + pulse * 6, 11 + pulse * 3); ctx.stroke();
        }
      }
    },

    // --------------------------------------------------------------- night --
    _glowSprite: function () {
      if (Render._lampGlow) return Render._lampGlow;
      var c = makeCanvas(160, 160), ctx = c.getContext('2d');
      var g = ctx.createRadialGradient(80, 80, 4, 80, 80, 80);
      g.addColorStop(0, 'rgba(255,200,110,0.7)'); g.addColorStop(0.3, 'rgba(255,180,90,0.28)'); g.addColorStop(1, 'rgba(255,160,70,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 160, 160);
      Render._lampGlow = c;
      return c;
    },
    drawNight: function (ctx, view) {
      var n = Render.night;
      if (n <= 0.01) return;
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = U.mix('#ffffff', '#2a3270', n * 0.8);
      ctx.fillRect(view.x - 4, view.y - 4, view.w + 8, view.h + 8);
      ctx.globalCompositeOperation = 'lighter';
      var glow = Render._glowSprite();
      ctx.globalAlpha = n;
      if (Render._buckets) {
        var cx0 = Math.max(0, Math.floor(view.x / CHPX)), cy0 = Math.max(0, Math.floor(view.y / CHPX));
        var cx1 = Math.min(Render._buckets.nx - 1, Math.floor((view.x + view.w) / CHPX)), cy1 = Math.min(Render._buckets.ny - 1, Math.floor((view.y + view.h) / CHPX));
        for (var cy = cy0; cy <= cy1; cy++) for (var cx = cx0; cx <= cx1; cx++) {
          var props = Render._buckets.props[cy * Render._buckets.nx + cx];
          for (var i = 0; i < props.length; i++) {
            var p = props[i];
            if (p.type !== 'lamp') continue;
            if (p.x < view.x - 80 || p.x > view.x + view.w + 80 || p.y < view.y - 80 || p.y > view.y + view.h + 80) continue;
            ctx.drawImage(glow, p.x - 36, p.y - 36, 72, 72);
          }
        }
      }
      var L = Render.lights;
      for (i = 0; i < L.length; i++) {
        var l = L[i];
        if (l.cone) {
          ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.a || 0);
          var g = ctx.createLinearGradient(0, 0, l.r, 0);
          g.addColorStop(0, l.color || 'rgba(255,240,200,0.6)'); g.addColorStop(1, 'rgba(255,240,200,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(l.r, -l.r * l.cone); ctx.lineTo(l.r, l.r * l.cone); ctx.closePath(); ctx.fill();
          ctx.restore();
        } else {
          ctx.drawImage(glow, l.x - l.r, l.y - l.r, l.r * 2, l.r * 2);
        }
      }
      ctx.restore();
    },

    // ------------------------------------------------------------------ fx --
    fx: {
      list: [],
      add: function (p) {
        var fx = Render.fx, R = GTP.rng;
        p.age = 0;
        if (p.life == null) p.life = { puff: 0.45, spark: 0.3, smoke: 1.4, fire: 0.35, explosion: 0.6, text: 1.3 }[p.type] || 0.5;
        if (p.type === 'explosion') {
          for (var i = 0; i < 10; i++) {
            var a = R.random() * U.TAU, s = 80 + R.random() * 220;
            fx.list.push({ type: 'spark', x: p.x, y: p.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.35 + R.random() * 0.3, age: 0, color: '#ffbe3c' });
          }
          for (i = 0; i < 6; i++) fx.list.push({ type: 'smoke', x: p.x + (R.random() - 0.5) * 20, y: p.y + (R.random() - 0.5) * 20, vx: (R.random() - 0.5) * 20, vy: -20 - R.random() * 20, life: 1.2 + R.random(), age: 0, r: 6 + R.random() * 6 });
          if (Render.cam) Render.cam.shake = Math.max(Render.cam.shake, 6);
        }
        fx.list.push(p);
        if (fx.list.length > 400) fx.list.splice(0, fx.list.length - 400);
        return p;
      },
      clear: function () { Render.fx.list.length = 0; },
      update: function (dt) {
        var l = Render.fx.list;
        for (var i = l.length - 1; i >= 0; i--) {
          var p = l[i];
          p.age += dt;
          if (p.vx) p.x += p.vx * dt;
          if (p.vy) p.y += p.vy * dt;
          if (p.type === 'spark') { p.vx *= 0.9; p.vy *= 0.9; }
          if (p.age >= p.life) { l[i] = l[l.length - 1]; l.pop(); }
        }
      },
      draw: function (ctx, view) {
        var l = Render.fx.list;
        for (var i = 0; i < l.length; i++) {
          var p = l[i];
          if (p.x < view.x - 100 || p.x > view.x + view.w + 100 || p.y < view.y - 100 || p.y > view.y + view.h + 100) continue;
          var t = p.age / p.life, k = 1 - t;
          switch (p.type) {
            case 'puff':
              ctx.globalAlpha = k * 0.7; ctx.fillStyle = p.color || '#e8e8e8';
              ctx.beginPath(); ctx.arc(p.x, p.y, (p.r0 || 3) + t * ((p.r1 || 12) - (p.r0 || 3)), 0, U.TAU); ctx.fill(); break;
            case 'spark':
              ctx.globalAlpha = k; ctx.strokeStyle = p.color || '#fff3b0'; ctx.lineWidth = 2;
              ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke(); break;
            case 'smoke':
              ctx.globalAlpha = k * 0.5; ctx.fillStyle = p.color || '#555a66';
              ctx.beginPath(); ctx.arc(p.x, p.y, (p.r || 6) + t * 14, 0, U.TAU); ctx.fill(); break;
            case 'fire':
              ctx.globalAlpha = k; ctx.fillStyle = t < 0.5 ? '#ffd23c' : '#ff6a3c';
              ctx.beginPath(); ctx.arc(p.x + Math.sin(p.age * 40) * 2, p.y - t * 8, (p.r || 6) * (1 - t * 0.5), 0, U.TAU); ctx.fill(); break;
            case 'explosion':
              ctx.globalAlpha = k; ctx.fillStyle = t < 0.3 ? '#fff6d0' : '#ff8a3c';
              ctx.beginPath(); ctx.arc(p.x, p.y, 10 + t * 50, 0, U.TAU); ctx.fill();
              ctx.globalAlpha = k * 0.8; ctx.strokeStyle = '#ffbe3c'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, 20 + t * 90, 0, U.TAU); ctx.stroke(); break;
            case 'text':
              ctx.globalAlpha = Math.min(1, k * 2); ctx.fillStyle = p.color || '#ffffff';
              ctx.font = 'bold ' + (p.size || 14) + 'px ui-monospace, Menlo, Consolas, monospace'; ctx.textAlign = 'center';
              ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 3; ctx.strokeText(p.text || '', p.x, p.y - t * 28); ctx.fillText(p.text || '', p.x, p.y - t * 28); break;
          }
        }
        ctx.globalAlpha = 1;
      }
    },

    // --------------------------------------------------------------- debug --
    drawDebugWorld: function (ctx, view) {
      if (!W.tiles) return;
      var tx0 = Math.max(0, Math.floor(view.x / TILE)), ty0 = Math.max(0, Math.floor(view.y / TILE));
      var tx1 = Math.min(W.w - 1, Math.floor((view.x + view.w) / TILE)), ty1 = Math.min(W.h - 1, Math.floor((view.y + view.h) / TILE));
      ctx.lineWidth = 1;
      for (var ty = ty0; ty <= ty1; ty++) for (var tx = tx0; tx <= tx1; tx++) {
        var t = W.tile(tx, ty), x = tx * TILE, y = ty * TILE;
        if (W.isSolidTile(t)) { ctx.fillStyle = 'rgba(255,0,0,0.18)'; ctx.fillRect(x, y, TILE, TILE); }
        var d = W.roadDir(x + 16, y + 16);
        if (d) {
          ctx.strokeStyle = 'rgba(0,255,255,0.7)'; ctx.beginPath(); ctx.moveTo(x + 16 - d.dx * 8, y + 16 - d.dy * 8); ctx.lineTo(x + 16 + d.dx * 8, y + 16 + d.dy * 8); ctx.stroke();
          ctx.fillStyle = 'rgba(0,255,255,0.9)'; ctx.fillRect(x + 16 + d.dx * 8 - 2, y + 16 + d.dy * 8 - 2, 4, 4);
        }
      }
      ctx.strokeStyle = 'rgba(255,255,0,0.4)';
      for (var cx = Math.floor(view.x / CHPX) * CHPX; cx < view.x + view.w; cx += CHPX) { ctx.beginPath(); ctx.moveTo(cx, view.y); ctx.lineTo(cx, view.y + view.h); ctx.stroke(); }
      for (var cy = Math.floor(view.y / CHPX) * CHPX; cy < view.y + view.h; cy += CHPX) { ctx.beginPath(); ctx.moveTo(view.x, cy); ctx.lineTo(view.x + view.w, cy); ctx.stroke(); }
      var E = GTP.Entities;
      if (E) for (var i = 0; i < E.list.length; i++) { var e = E.list[i]; ctx.strokeStyle = 'rgba(0,255,0,0.8)'; ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, U.TAU); ctx.stroke(); }
    },
    drawDebugHud: function (ctx) {
      var g = GTP.game, p = g.player;
      var lines = [
        'fps ' + (g.fps | 0) + '  frame ' + Render.stats.frameMs.toFixed(1) + 'ms  steps ' + g.steps,
        'cam ' + (Render.cam.x | 0) + ',' + (Render.cam.y | 0) + ' z' + Render.cam.zoom.toFixed(2) + '  chunks ' + Render.chunks.size + ' (' + Render.stats.chunkPaints + ' paints)',
        'ents ' + (GTP.Entities ? GTP.Entities.list.length : 0) + ' drawn ' + Render.stats.drawnEntities + '  fx ' + Render.fx.list.length + '  errors ' + GTP.errors.length,
        p ? ('player ' + (p.x | 0) + ',' + (p.y | 0) + ' tile ' + Math.floor(p.x / TILE) + ',' + Math.floor(p.y / TILE) + ' ' + ((W.districtAt(p.x, p.y) || {}).id || '-') + ' clock ' + U.fmtClock(g.time.clock) + ' night ' + Render.night.toFixed(2)) : ''
      ];
      ctx.font = '12px ui-monospace, Menlo, Consolas, monospace'; ctx.textAlign = 'left';
      for (var i = 0; i < lines.length; i++) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(8, VH - 70 + i * 15, ctx.measureText(lines[i]).width + 8, 14);
        ctx.fillStyle = '#9dff3c'; ctx.fillText(lines[i], 12, VH - 59 + i * 15);
      }
    }
  };
})();

</script>
<script>
/* js/10_ui.js */
/* Grand Theft Pundit: 10_ui.js
 * GTP.UI stub. HUD, minimap, dialogue, menus, touch controls and minigames are
 * the UI agent's job. update/draw are no-ops except for a one-line placeholder
 * title prompt so a non-headless boot is not a blank screen.
 */
(function () {
  'use strict';
  var GTP = window.GTP = window.GTP || {};

  var UI = GTP.UI = {
    screen: 'none',
    toasts: [],
    init: function () { UI.screen = 'none'; },
    update: function (/* dt */) {},
    draw: function (ctx) {
      var g = GTP.game;
      if (!g || g.state !== 'title') return;
      var C = GTP.C;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, C.VIEW_H / 2 - 70, C.VIEW_W, 140);
      ctx.fillStyle = '#ff3fa4';
      ctx.font = 'bold 44px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillText('GRAND THEFT PUNDIT', C.VIEW_W / 2, C.VIEW_H / 2 - 10);
      ctx.fillStyle = '#eef1fb';
      ctx.font = '18px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillText('press Enter to start', C.VIEW_W / 2, C.VIEW_H / 2 + 36);
      ctx.restore();
    },
    showDialogue: function (/* line */) {},
    closeDialogue: function () {},
    banner: function (/* text, sub */) {},
    toast: function (text) { UI.toasts.push({ text: String(text), t: 0 }); if (UI.toasts.length > 8) UI.toasts.shift(); },
    touch: { visible: false, handle: function (/* touchEvent */) {} },
    minigames: {
      debate: function (params, onResult) { if (onResult) onResult(true); },
      ratio: function (params, onResult) { if (onResult) onResult(true); }
    },
    drawPortrait: function (/* ctx, recipe, x, y, size */) {}
  };
  void UI;
})();

</script>
<script>
/* js/20_content_world.js */
/* Grand Theft Pundit: 20_content_world.js
 * GTP.Content.world: the city. Pure data plus tiny helpers. All coordinates
 * are in TILES (32 px each) on a 128 x 128 map. GTP.World.generate reads this.
 *
 * Layout conventions
 * - roads: {axis:'h'|'v', at, from, to, cls, bridge?}. `at` is the grid line;
 *   streets are 2 tiles wide (at-1..at), avenues and highways 4 tiles wide
 *   (at-2..at+1). Highways get 1-tile concrete shoulders with barriers.
 *   A road never carves water unless bridge:true (then it becomes a BRIDGE).
 * - districts: tile rects with a style key from GTP.C.DISTRICT_STYLES.
 * - landmarks: block = top-left lot tile, size = lot size in tiles. The
 *   footprint (building) is centered in the lot; the rest of the lot is
 *   `ground` ('plaza'|'grass'|'parking'|'sand'). Kinds with no building:
 *   park, quad, pier, beach, helipad, docks, bridge.
 *   Ids are placeholders the content agent renames/extends.
 */
(function () {
  'use strict';
  var GTP = window.GTP = window.GTP || {};
  GTP.Content = GTP.Content || {};

  function rect(x, y, w, h) { return { x: x, y: y, w: w, h: h }; }
  function road(axis, at, from, to, cls, bridge) {
    var r = { axis: axis, at: at, from: from, to: to, cls: cls || 'street' };
    if (bridge) r.bridge = true;
    return r;
  }
  function lm(id, name, kind, bx, by, w, h, opts) {
    var o = { id: id, name: name, kind: kind, block: { bx: bx, by: by }, size: { w: w, h: h }, label: name };
    if (opts) for (var k in opts) o[k] = opts[k];
    return o;
  }
  function fp(w, h) { return { w: w, h: h }; }

  GTP.Content.world = {
    cityName: 'Punditropolis',

    // where a new game starts: landmark center plus an offset in px
    playerSpawn: { landmark: 'campus_quad', dx: 0, dy: 140 },
    respawn: { hospital: 'hospital', police: 'police_hq' },

    layout: {
      w: 128, h: 128,
      base: 'grass',

      water: [
        rect(0, 0, 128, 6), rect(0, 122, 128, 6), rect(0, 0, 6, 128), rect(122, 0, 6, 128), // sea border
        rect(0, 102, 128, 26),     // the bay (south)
        rect(99, 40, 6, 62),       // the channel between the city and the island
        rect(104, 0, 24, 22),      // north-east cove
        rect(8, 54, 4, 4)          // pond in the west park
      ],
      sand: [
        rect(105, 22, 17, 1)       // thin beach on the cove
      ],

      roads: [
        // vertical
        road('v', 16, 6, 101, 'street'),
        road('v', 32, 6, 29, 'street'),
        road('v', 32, 30, 81, 'highway'),
        road('v', 32, 82, 101, 'street'),
        road('v', 48, 34, 101, 'street'),
        road('v', 64, 6, 101, 'avenue'),
        road('v', 80, 6, 101, 'street'),
        road('v', 96, 6, 29, 'street'),
        road('v', 96, 30, 81, 'highway'),
        road('v', 96, 82, 101, 'street'),
        road('v', 112, 23, 101, 'street'),
        // horizontal
        road('h', 16, 6, 32, 'street'),
        road('h', 16, 62, 103, 'street'),
        road('h', 32, 6, 29, 'street'),
        road('h', 32, 30, 97, 'highway'),
        road('h', 32, 98, 121, 'street'),
        road('h', 48, 6, 97, 'street'),
        road('h', 48, 105, 121, 'street'),
        road('h', 64, 6, 121, 'avenue', true),   // main avenue, bridge over the channel
        road('h', 80, 6, 29, 'street'),
        road('h', 80, 30, 97, 'highway'),
        road('h', 80, 105, 121, 'street'),
        road('h', 96, 6, 121, 'street', true)    // marina shore road, small bridge
      ],

      districts: [
        { id: 'suburbs',    name: 'Vinyl Acres',       x: 0,  y: 0,  w: 32, h: 64,  style: 'suburb',     tint: '#7fbf6a' },
        { id: 'industrial', name: 'Rustbelt Yards',    x: 0,  y: 64, w: 32, h: 64,  style: 'industrial', tint: '#b08a5a' },

<script>
/* js/30_game.js */
/* Grand Theft Pundit: 30_game.js

  function parseParams() {

    this.player = null;
    this.headless = false;
    this.debugMode = false;
    this.seed = 1;
    this.opts = {};
    this.booted = false;
    this.steps = 0;
    this.frames = 0;
    this.fps = 0;
    this._acc = 0;
    this._last = 0;

  Game.prototype.boot = function (opts) {

    this.debugMode = truthy(opts.debug);

    var skipTitle = truthy(opts.skipTitle) || this.headless;
    var canvas = this.canvas = (typeof document !== 'undefined') ? document.getElementById('game') : null;
    if (!canvas) { U.reportError(new Error('no #game canvas'), 'boot'); return this; }

      GTP.Input.init(canvas);
      GTP.Render.init(canvas);
      GTP.Audio.init({ headless: this.headless, mute: truthy(opts.mute) });

      GTP.UI.init();
      if (opts.mission && GTP.Missions.start) {
        try { this._prepMission(String(opts.mission)); } catch (e) { U.reportError(e, 'boot.mission'); }

      try { GTP.Render.frame(1); } catch (e) { U.reportError(e, 'boot.render'); }

  Game.prototype._prepMission = function (id) {

    var m = byId[id]; if (!m) return;
    var st = GTP.Missions.state;
    (function mark(mm) { (mm.requires || []).forEach(function (r) { if (byId[r] && !st.completed.has(r)) { st.completed.add(r); mark(byId[r]); } }); })(m);

  };

  Game.prototype.newGame = function (seed) {
    seed = seed | 0;
    this.seed = seed;
    GTP.rng.seed(seed);
    GTP.World.generate(seed);
    GTP.Render.invalidateAll();
    GTP.Render.fx.clear();

    if (this.player) E.remove(this.player);
    E.clearDynamic();
    E.list.length = 0; E.hash.clear();

    this.time = { t: 0, clock: C.DAY.startClock, day: 1 };
    this.steps = 0;
    if (GTP.AI.spawner && GTP.AI.spawner.warmup) { try { GTP.AI.spawner.warmup(); } catch (e) { U.reportError(e, 'spawner.warmup'); } }

    GTP.Render.cam.zoom = C.CAMERA.zoomFoot;
    GTP.Render.snapCamera();

  };

  Game.prototype._spawnPoint = function () {
    var CW = GTP.Content.world, sp = CW.playerSpawn || {};

    if (sp.landmark) {
      var lm = GTP.World.landmark(sp.landmark);
      if (lm) { x = lm.x + (sp.dx || 0); y = lm.y + (sp.dy || 0); }
    }
    if (x == null || y == null) { var p = GTP.World.randomSidewalkPoint(); x = p.x; y = p.y; }

    if (GTP.World.solidAt(x, y)) {
      var t = GTP.World.nearestTileOf(x, y, function (tt) { return !GTP.World.isSolidTile(tt); }, 16);
      if (t) { x = (t.tx + 0.5) * C.TILE; y = (t.ty + 0.5) * C.TILE; }
    }
    return { x: x, y: y };
  };

  Game.prototype.setState = function (s) {
    if (s === this.state) return;
    this.prevState = this.state;
    this.state = s;
    if (GTP.UI && GTP.UI.onState) { try { GTP.UI.onState(s, this.prevState); } catch (e) { U.reportError(e, 'ui.onState'); } }
  };

  Game.prototype._handleGlobalInput = function () {

  Game.prototype.step = function () {

      this._handleGlobalInput();
      if (SIM_STATES[this.state]) {
        GTP.Missions.update(dt);
        GTP.AI.update(dt);
        GTP.Entities.update(dt);
        GTP.Combat.update(dt);
        GTP.Render.fx.update(dt);

        this.time.clock += dt / C.DAY.secondsPerHour;
        if (this.time.clock >= 24) { this.time.clock -= 24; this.time.day++; }

      GTP.Render.updateCamera(dt);

  };

  Game.prototype.render = function (alpha) {

  };

  Game.prototype._loop = function (ts) {

    if (this._fpsT >= 0.5) { this.fps = this._fpsN / this._fpsT; this._fpsN = 0; this._fpsT = 0; }
  };

  // ------------------------------------------------------------- save/load --
  Game.prototype.hasSave = function () {
    try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  };
  Game.prototype.save = function () {

      version: 1, seed: this.seed, money: p.money, x: p.x, y: p.y, weapons: p.weapons, weapon: p.weapon, armor: p.armor, hp: p.hp,
      completed: Array.from(GTP.Missions.state.completed || []), flags: GTP.Missions.state.flags || {}, stats: p.stats || {},

      return true;
    } catch (e) {
      if (GTP.UI.toast) GTP.UI.toast('Could not save (storage blocked)');
      return false;
    }
  };
  Game.prototype.load = function () {
    var raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { raw = null; }
    if (!raw) return false;
    var data;
    try { data = JSON.parse(raw, function (k, v) { return v === 'inf' ? Infinity : v; }); } catch (e) { if (GTP.UI.toast) GTP.UI.toast('Save file is corrupt'); return false; }

      this.newGame(data.seed | 0);
      var p = this.player;
      p.money = data.money | 0; p.x = data.x; p.y = data.y; p._px = p.x; p._py = p.y;

      p.armor = data.armor || 0; p.hp = data.hp || p.maxHp; p.stats = data.stats || p.stats;

      this.time.day = data.day || 1;

    } catch (e) {

      return false;
    }
  };

  Game.prototype._makeDebug = function () {
    var g = this;
    return {
      teleport: function (x, y) { var p = g.player; if (!p) return; p.x = x; p.y = y; p._px = x; p._py = y; p.vx = p.vy = 0; GTP.Entities.hash.update(p); GTP.Render.snapCamera(); },
      spawnVehicle: function (x, y, type) {

        var v = new GTP.Vehicle({ x: x, y: y, type: type || 'sedan' });
        var d = GTP.World.roadDir(x, y); if (d) v.angle = Math.atan2(d.dy, d.dx);

      giveWeapon: function (id, ammo) { var p = g.player; if (!p) return; p.weapons[id] = (p.weapons[id] || 0) + (ammo == null ? 50 : ammo); p.weapon = id; },
      setWanted: function (n) { var p = g.player; if (!p) return; p.wanted = U.clamp(n | 0, 0, 5); var th = C.WANTED.thresholds; p.wantedHeat = p.wanted ? th[p.wanted - 1] : 0; if (GTP.AI.wanted) { GTP.AI.wanted.level = p.wanted; GTP.AI.wanted.heat = p.wantedHeat; } },

      errors: function () { return GTP.errors.slice(); }
    };
  };

  GTP.Game = Game;

  function autoboot() {
    if (window.GTP_NO_AUTOBOOT) return;
    try {
      GTP.game = new Game();
      GTP.game.boot();
    } catch (e) { U.reportError(e, 'autoboot'); }
  }
  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', autoboot);
    else autoboot();
  }
})();

</script>
