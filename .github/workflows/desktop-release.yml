# Desktop builds of Grand Theft Pundit (Electron + electron-builder) for macOS (Apple Silicon and
# Intel), Windows and Linux, published as a GitHub Release.
#
#   - push a tag like v0.1.0            -> build everything and create/update the release for that tag
#   - push to game/grand-theft-pundit   -> build everything; a commit message with [release] also publishes
#                                          the release v<desktop/package.json version>
#   - "Run workflow" (workflow_dispatch) -> build everything and upload workflow artifacts; fill in
#                                          release_tag (existing or new, created at the built commit) to also publish a release
#
# Signing is optional. Add these repository secrets and the macOS job signs (and notarizes) instead
# of producing an unsigned build; without them every step still runs and the output is unsigned:
#   CSC_LINK, CSC_KEY_PASSWORD                     Developer ID Application certificate (.p12 as base64) + its password
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   notarization (needs all three, plus CSC_LINK)
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD             optional Windows Authenticode certificate
#
# Every build also writes the electron-updater metadata (latest.yml, latest-mac.yml, latest-linux.yml
# and the *.blockmap files) and attaches it to the release; installed games read it to update
# themselves (desktop/lib/updater.js). Every build job reads the Electron fuses back from the packaged
# app (desktop/test/check-fuses.js) and launches it (desktop/test/smoke.js: the macOS arm64 app and
# the Windows app boot to the title; the `smoke` job runs the Linux AppImage under xvfb through the
# title and into a new game). The release job waits for all of them, so a build that does not boot
# never ships.
#
# Permissions: the token is read-only everywhere except the release job, and checkouts do not keep
# it in .git/config, so dependency install scripts never hold a write-capable token (QAC-06).
# See grand-theft-pundit/desktop/README.md.

name: Desktop release

on:
  push:
    tags:
      - "v*"
    # building on every push to the game branch means nobody has to click "Run workflow"; a commit
    # whose message contains [release] also publishes a GitHub Release tagged v<desktop/package.json version>
    branches:
      - game/grand-theft-pundit
      # the desktop track's branch, so changes to this workflow and desktop/ are built and smoke-tested
      # on every platform before they reach the game branch; it never publishes (see the release job)
      - v03/desktop
    paths:
      - "grand-theft-pundit/index.html"
      - "grand-theft-pundit/js/**"
      - "grand-theft-pundit/vendor/**"
      - "grand-theft-pundit/desktop/**"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing git tag to attach the builds to as a GitHub Release (leave empty to only upload workflow artifacts)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # A newer push to a branch supersedes an older plain build. A run that publishes (a tag, a manual run
  # with release_tag, or a [release] commit) gets a group of its own, so a later push can never cancel
  # it halfway through uploading the release.
  group: desktop-release-${{ github.ref }}-${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')) && github.sha || 'build' }}
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[release]') }}

env:
  NODE_VERSION: "22"
  # --publish never keeps electron-builder from uploading anything (the release job does that); the
  # github publish config only makes it write latest*.yml and blockmaps. electron-builder.yml keeps
  # publish: null so local builds with a stray GH_TOKEN never try to publish.
  UPDATE_METADATA: >-
    --publish never
    -c.publish.provider=github
    -c.publish.owner=${{ github.repository_owner }}
    -c.publish.repo=${{ github.event.repository.name }}

jobs:
  mac:
    name: macOS (arm64 + x64, dmg + zip)
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: grand-theft-pundit/desktop
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node (with the npm download cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: grand-theft-pundit/desktop/package-lock.json

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          # the lockfile pins electron and electron-builder (and so the binaries they download)
          key: ${{ runner.os }}-electron-${{ hashFiles('grand-theft-pundit/desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Copy the game into desktop/app
        run: node sync-game.js

      - name: Check for signing secrets
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID certificate found: the build will be signed."
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "No CSC_LINK/CSC_KEY_PASSWORD secrets: the build will be unsigned."
          fi
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
            echo "Apple ID secrets found: the signed build will be notarized."
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (unsigned)
        if: steps.signing.outputs.sign != 'true'
        env:
          # never pick up a stray identity from the runner keychain
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --arm64 --x64 $UPDATE_METADATA

      - name: Build (signed, notarized when Apple ID secrets exist)
        if: steps.signing.outputs.sign == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ steps.signing.outputs.notarize == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ steps.signing.outputs.notarize == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.signing.outputs.notarize == 'true' && secrets.APPLE_TEAM_ID || '' }}
        # notarization requires the hardened runtime; electron-builder.yml keeps it off for unsigned builds
        run: npx electron-builder --mac dmg zip --arm64 --x64 $UPDATE_METADATA -c.mac.hardenedRuntime=true

      - name: List outputs and check the update metadata
        run: |
          ls -la dist
          test -s dist/latest-mac.yml || { echo "::error::electron-builder did not write dist/latest-mac.yml (auto-update metadata)"; exit 1; }
          cat dist/latest-mac.yml

      - name: Check the DMG window artwork
        # mount each disk image and make sure the background (build/background.png, @2x merged into
        # .background.tiff by electron-builder) and the Finder layout (.DS_Store) made it in
        run: |
          for dmg in dist/*.dmg; do
            mnt="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mnt" "$dmg" > /dev/null
            echo "$dmg:"; ls -la "$mnt" "$mnt/.background" || true
            ok=true
            # electron-builder 26 stores it as .background.tiff at the volume root (older versions used .background/)
            { ls "$mnt"/.background.tiff "$mnt"/.background.png "$mnt"/.background/*.tiff "$mnt"/.background/*.png 2>/dev/null | grep -q .; } || { echo "::error::$dmg has no background image"; ok=false; }
            test -f "$mnt/.DS_Store" || { echo "::error::$dmg has no Finder layout (.DS_Store)"; ok=false; }
            hdiutil detach "$mnt" > /dev/null || hdiutil detach -force "$mnt" > /dev/null
            $ok || exit 1
          done

      - name: Check the fuses and the code signature
        # an unsigned Apple Silicon app whose signature no longer matches (fuses are flipped after
        # packaging) is killed at launch, so verify both architectures' bundles
        run: |
          node test/check-fuses.js "dist/mac-arm64/Grand Theft Pundit.app" "dist/mac/Grand Theft Pundit.app"
          for app in "dist/mac-arm64/Grand Theft Pundit.app" "dist/mac/Grand Theft Pundit.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - name: Launch the Apple Silicon app (title screen, mods, window state)
        run: >-
          node test/smoke.js "dist/mac-arm64/Grand Theft Pundit.app/Contents/MacOS/Grand Theft Pundit"
          --no-new-game --out smoke-out --timeout 240

      - name: Upload the macOS smoke screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-mac
          path: grand-theft-pundit/desktop/smoke-out/
          if-no-files-found: ignore

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            grand-theft-pundit/desktop/dist/*.dmg
            grand-theft-pundit/desktop/dist/*.zip
            grand-theft-pundit/desktop/dist/*.blockmap
            grand-theft-pundit/desktop/dist/latest-mac.yml
          if-no-files-found: error

  windows:
    name: Windows (x64, installer + portable)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: grand-theft-pundit/desktop
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node (with the npm download cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: grand-theft-pundit/desktop/package-lock.json

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          # the lockfile pins electron and electron-builder (and so the binaries they download)
          key: ${{ runner.os }}-electron-${{ hashFiles('grand-theft-pundit/desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Copy the game into desktop/app
        run: node sync-game.js

      - name: Build (signed only when WIN_CSC_LINK is set)
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis portable --x64 $UPDATE_METADATA

      - name: List outputs and check the update metadata
        run: |
          ls -la dist
          test -s dist/latest.yml || { echo "::error::electron-builder did not write dist/latest.yml (auto-update metadata)"; exit 1; }
          cat dist/latest.yml

      - name: Check the fuses
        run: node test/check-fuses.js "dist/win-unpacked/Grand Theft Pundit.exe"

      - name: Launch the Windows app (title screen, mods, window state)
        run: >-
          node test/smoke.js "dist/win-unpacked/Grand Theft Pundit.exe"
          --no-new-game --out smoke-out --timeout 240

      - name: Upload the Windows smoke screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows
          path: grand-theft-pundit/desktop/smoke-out/
          if-no-files-found: ignore

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            grand-theft-pundit/desktop/dist/*.exe
            grand-theft-pundit/desktop/dist/*.blockmap
            grand-theft-pundit/desktop/dist/latest.yml
          if-no-files-found: error

  linux:
    name: Linux (x64, AppImage)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: grand-theft-pundit/desktop
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node (with the npm download cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: grand-theft-pundit/desktop/package-lock.json

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          # the lockfile pins electron and electron-builder (and so the binaries they download)
          key: ${{ runner.os }}-electron-${{ hashFiles('grand-theft-pundit/desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Copy the game into desktop/app
        run: node sync-game.js

      - name: Build
        run: npx electron-builder --linux AppImage --x64 $UPDATE_METADATA

      - name: List outputs and check the update metadata
        run: |
          ls -la dist
          test -s dist/latest-linux.yml || { echo "::error::electron-builder did not write dist/latest-linux.yml (auto-update metadata)"; exit 1; }
          cat dist/latest-linux.yml

      - name: Check the fuses
        run: node test/check-fuses.js dist/linux-unpacked/grand-theft-pundit

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            grand-theft-pundit/desktop/dist/*.AppImage
            grand-theft-pundit/desktop/dist/latest-linux.yml
          if-no-files-found: error

  smoke:
    name: Smoke test (packaged Linux app under xvfb)
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out (the smoke script only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: grand-theft-pundit/desktop/test
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Node (22+ for the built-in WebSocket)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb > /dev/null

      - name: Download the Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux-build

      - name: Extract the AppImage
        # extracting avoids needing FUSE 2 on the runner; the binary inside is exactly what users run
        working-directory: linux-build
        run: |
          chmod +x ./*.AppImage
          ./*.AppImage --appimage-extract > /dev/null
          ls squashfs-root

      - name: Launch the game, check the title screen and play into a new game
        run: >-
          xvfb-run -a -s "-screen 0 1280x800x24"
          node grand-theft-pundit/desktop/test/smoke.js linux-build/squashfs-root/grand-theft-pundit
          --out smoke-out --timeout 240

      - name: Upload the smoke screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          # smoke-title.png, smoke-cutscene.png, smoke-objective.png, smoke-crash.log
          path: smoke-out/
          if-no-files-found: ignore

  release:
    name: GitHub Release
    needs: [mac, windows, linux, smoke]
    # [release] publishes only from the game branch; other branches in `on.push` only build and test
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/game/grand-theft-pundit' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    # the only job that may write: it creates the tag and the release
    permissions:
      contents: write
    # two publishing runs (a [release] commit and its tag pushed together) never upload at once
    concurrency:
      group: desktop-publish
      cancel-in-progress: false
    steps:
      - name: Check out (for the version number)
        uses: actions/checkout@v4
        with:
          sparse-checkout: grand-theft-pundit/desktop/package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Decide the release tag
        # every value arrives through the environment, never pasted into the script (QAC-30)
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="v$(node -p "require('./grand-theft-pundit/desktop/package.json').version")"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          # the file names and latest*.yml carry package.json's version; a tag that disagrees would
          # publish files no installed game is ever offered
          version="v$(node -p "require('./grand-theft-pundit/desktop/package.json').version")"
          if [ "$REF_TYPE" = "tag" ] && [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match desktop/package.json ($version); bump the version and tag again"
            exit 1
          fi
          existing="$(git ls-remote --tags origin "refs/tags/$tag^{}" "refs/tags/$tag" 2>/dev/null | head -n1 | cut -f1)"
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::warning::$tag already exists (at $existing); this run replaces that release's files with builds of $GITHUB_SHA. Bump the version in desktop/package.json for a new release."
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Release tag: $tag"

      - name: Download every build
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          # mac, windows and linux; not the smoke screenshots
          pattern: "{mac,windows,linux}"
          merge-multiple: true

      - name: List release assets
        run: |
          ls -la release-assets
          for f in latest.yml latest-mac.yml latest-linux.yml; do
            test -s "release-assets/$f" || { echo "::error::release-assets/$f is missing; installed games could not update"; exit 1; }
          done

      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Grand Theft Pundit ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          append_body: true
          fail_on_unmatched_files: true
          files: release-assets/*
          body: |
            Downloads for Grand Theft Pundit ${{ env.RELEASE_TAG }}:

            - **macOS, Apple Silicon (M1 and later):** `Grand-Theft-Pundit-*-mac-arm64.dmg`
            - **macOS, Intel:** `Grand-Theft-Pundit-*-mac-x64.dmg` (the `.zip` files hold the same apps without the installer window)
            - **Windows 10/11:** `Grand-Theft-Pundit-*-win-x64-setup.exe` (installer) or `Grand-Theft-Pundit-*-win-x64-portable.exe` (no install)
            - **Linux:** `Grand-Theft-Pundit-*-linux-x86_64.AppImage` (`chmod +x` it, then run it)

            Already have 0.3 or later? The game checks this page by itself: the Windows installer and the
            Linux AppImage download the update in the background and offer **Restart to Update**; unsigned
            macOS builds and the portable exe say a new version is out and open this page. (`latest*.yml`
            and `*.blockmap` are the update metadata the game reads; you never need to download them.)

            Unless this release was built with a signing certificate, macOS and Windows will warn that the
            developer is unknown. On macOS 14 and earlier: Control-click the app, choose **Open**, then **Open**
            again. On macOS 15 and later: open it once, dismiss the message, then go to **System Settings >
            Privacy & Security** and click **Open Anyway**. On Windows: **More info > Run anyway**.
